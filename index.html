<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dun Dun Creations | Custom T-Shirt Printing</title>
    <style>
        /* Modern Flat Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a; /* Premium Dark Slate */
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 650px;
            padding: 40px 20px;
        }
        .status-badge {
            display: inline-block;
            background-color: #3b82f6; /* Modern Flat Blue */
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 6px 16px;
            border-radius: 4px;
            margin-bottom: 24px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 16px;
            color: #ffffff;
        }
        h2 {
            font-size: 1.2rem;
            font-weight: 400;
            color: #94a3b8;
            margin-bottom: 36px;
            line-height: 1.6;
        }
        .service-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 45px;
        }
        .tag {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .footer-info {
            padding-top: 30px;
            border-top: 1px solid #334155;
            font-size: 1rem;
            color: #cbd5e1;
        }
        .contact-line {
            margin: 10px 0;
        }
        .highlight {
            color: #3b82f6;
            font-weight: 700;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-badge">Website Coming Soon</div>
        
        <h1>DUN DUN CREATIONS</h1>
        <h2>We are upgrading to a modern digital experience. Get ready for premium customized and corporate printing services.</h2>
        
        <div class="service-tags">
            <div class="tag">Custom T-Shirts</div>
            <div class="tag">Corporate Gifting</div>
            <div class="tag">Event Merchandise</div>
        </div>

        <div class="footer-info">
            <div class="contact-line">📍 Madanpur, Aurangabad, Bihar</div>
            <div class="contact-line">📞 Order on WhatsApp: <span class="highlight">+91 8544663887</span></div>
        </div>
    </div>
</body>
</html>
